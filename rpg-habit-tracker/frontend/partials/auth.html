<div id="auth-screen" class="screen active">
    <div class="auth-container">
        <div class="logo">
            <span class="logo-lvl">LVL</span>
            <span class="logo-up">UP</span>
            <p class="logo-sub">Прокачай себя как персонажа</p>
        </div>

        <button id="google-login-btn"
            onclick="window.location.href='/auth/google/login'"
            class="btn-google">
            <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
                <path d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844c-.209 1.125-.843 2.078-1.796 2.717v2.258h2.908c1.702-1.567 2.684-3.874 2.684-6.615z" fill="#4285F4"/>
                <path d="M9 18c2.43 0 4.467-.806 5.956-2.18l-2.908-2.259c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332C2.438 15.983 5.482 18 9 18z" fill="#34A853"/>
                <path d="M3.964 10.71c-.18-.54-.282-1.117-.282-1.71s.102-1.17.282-1.71V4.958H.957C.347 6.173 0 7.548 0 9s.348 2.827.957 4.042l3.007-2.332z" fill="#FBBC05"/>
                <path d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0 5.482 0 2.438 2.017.957 4.958L3.964 6.29C4.672 4.163 6.656 3.58 9 3.58z" fill="#EA4335"/>
            </svg>
            Войти через Google
        </button>

        <div class="oauth-divider" id="oauth-divider">
            <span>или</span>
        </div>

        <div class="tabs">
            <button class="tab-btn active" data-tab="login-pane">Войти</button>
            <button class="tab-btn" data-tab="register-pane">Регистрация</button>
        </div>

        <div id="login-pane" class="tab-pane active">
            <form id="login-form">
                <div class="field">
                    <label>Email</label>
                    <input id="login-email" type="email" placeholder="hero@lvlup.app" required>
                </div>
                <div class="field">
                    <label>Пароль</label>
                    <input id="login-password" type="password" placeholder="••••••••" required>
                </div>
                <div class="error-msg" id="login-error"></div>
                <button type="submit" class="btn-primary">Войти</button>
            </form>
        </div>

        <div id="register-pane" class="tab-pane">
            <form id="register-form">
                <div class="field">
                    <label>Email</label>
                    <input id="reg-email" type="email" placeholder="hero@lvlup.app" required>
                </div>
                <div class="field">
                    <label>Пароль</label>
                    <input id="reg-password" type="password" placeholder="Минимум 8 символов" required>
                </div>
                <div class="field">
                    <label>Повтори пароль</label>
                    <input id="reg-confirm" type="password" placeholder="••••••••" required>
                </div>
                <div class="error-msg" id="reg-error"></div>
                <button type="submit" class="btn-primary">Зарегистрироваться</button>
            </form>
        </div>
    </div>
</div>

<div id="otp-screen" class="screen">
    <div class="auth-container">
        <div class="logo">
            <span class="logo-lvl">LVL</span>
            <span class="logo-up">UP</span>
        </div>
        <div class="otp-card">
            <div class="otp-icon">📧</div>
            <h2>Подтверди email</h2>
            <p class="otp-hint">Мы отправили 6-значный код.<br>Пока в разработке — смотри в терминал.</p>
            <form id="otp-form">
                <input id="otp-input" type="text" maxlength="6" placeholder="000000"
                    class="otp-input" autocomplete="one-time-code" required>
                <div class="error-msg" id="otp-error"></div>
                <button type="submit" class="btn-primary">Подтвердить</button>
            </form>
        </div>
    </div>
</div>

<div id="onboarding-screen" class="screen">
    <div class="auth-container onboarding-container">
        <h1 class="onboarding-title">Создай персонажа</h1>
        <p class="onboarding-sub">Это начало твоего RPG-путешествия</p>
        <div class="character-preview">
            <div class="character-sprite baby"></div>
            <div class="character-level">Уровень 1 · Малыш</div>
        </div>
        <form id="onboarding-form">
            <div class="field">
                <label>Username <span class="field-hint-inline">@ник — уникальный, поменять можно раз в 7 дней</span></label>
                <input id="onboarding-username" type="text" placeholder="anna_2024"
                       maxlength="30" autocomplete="off" required>
                <div id="onboarding-username-hint" class="username-hint username-hint-muted" style="display:none"></div>
            </div>
            <div class="field">
                <label>Твоё имя</label>
                <input id="display-name" type="text" placeholder="Как тебя зовут?" required maxlength="50">
            </div>
            <div class="field">
                <label>Имя персонажа</label>
                <input id="character-name" type="text" placeholder="Имя твоего героя" required maxlength="50">
            </div>
            <div class="field">
                <label>Пол персонажа</label>
                <div class="gender-select">
                    <button type="button" class="gender-btn" data-gender="male">⚔️ Мужской</button>
                    <button type="button" class="gender-btn" data-gender="female">🌸 Женский</button>
                </div>
            </div>
            <div class="error-msg" id="onboarding-error"></div>
            <button type="submit" class="btn-primary btn-glow">✨ Начать приключение</button>
        </form>
    </div>
</div>
